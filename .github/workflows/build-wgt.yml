name: Build Tizen .wgt

# Serializa los dos workflows para que Android y Tizen adjunten assets
# al mismo release/tag sin intentar crearlo simultáneamente.
concurrency:
  group: osmtwich-release-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '*.md'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Primera versión del esquema: 2.7.1 -> 2.7.2 ... 2.7.9 -> 2.8.0 ...
  # (la lógica está en .github/scripts/compute-version.sh, compartida con Android)
  VERSION_START: "2.7.1"

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar versión en config.xml
        run: |
          APP_VERSION="$(bash .github/scripts/compute-version.sh)"
          sed -i -E "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$APP_VERSION\"/" index.html
          grep -q "const APP_VERSION = \"$APP_VERSION\"" index.html || { echo "ERROR: no se pudo actualizar APP_VERSION"; exit 1; }
          VERSION="$APP_VERSION"
          echo "Nueva versión: $VERSION"
          VERSION="$VERSION" perl -0pi -e 's/(<widget\b[^>]*?\sversion=")[^"]*(")/$1$ENV{VERSION}$2/s' tizen/config.xml
          grep -q "version=\"$VERSION\"" tizen/config.xml || { echo "ERROR: no se pudo actualizar la versión en config.xml"; exit 1; }
          grep -n 'version=' tizen/config.xml

      - name: Empaquetar .wgt unsigned
        run: |
          # La app va directamente como index.html dentro del .wgt (sin lanzador
          # que redirige a app.html): funciona igual en el TV real y en emuladores
          # web, donde una navegación relativa daba 404.
          cp index.html tizen/index.html
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt

      - name: Crear o actualizar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: OsmTwich v${{ env.APP_VERSION }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: OsmTwich.wgt
          body: |
            Versión: ${{ env.APP_VERSION }}

            ## Cambios
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar versión de la secuencia
        run: |
          TAG="osmtwich-version-v${APP_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "La versión $APP_VERSION ya está registrada."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
