name: Build Tizen .wgt

on:
  push:
    branches: [main]
    paths:
      - "tizen/**"
      - "index.html"
      - ".github/workflows/build-wgt.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar .wgt unsigned
        run: |
          cp index.html tizen/app.html
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt

      - name: Crear Release (solo en push a main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wgt-${{ github.run_number }}
          name: OsmTwich TV ${{ github.run_number }} (unsigned)
          files: OsmTwich.wgt
          body: |
            Unsigned .wgt package

            ## Cambios
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
