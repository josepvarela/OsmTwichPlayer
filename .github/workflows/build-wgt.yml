name: Build Tizen .wgt

on:
  push:
    branches: [main]
    paths:
      - "tizen/**"
      - "index.html"
      - ".github/workflows/build-wgt.yml"
  workflow_dispatch: {}

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar .wgt (sin firmar)
        run: |
          cp index.html tizen/app.html
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt
