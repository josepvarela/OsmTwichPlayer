name: Build Tizen .wgt

# Serializa los dos workflows para que Android y Tizen adjunten assets
# al mismo release/tag sin intentar crearlo simultáneamente.
concurrency:
  group: osmtwich-release-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "tizen/**"
      - "index.html"
      - "api/**"
      - ".github/workflows/build-wgt.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Base compartida con Android: primer build 2.0.0, luego 2.1.0, 2.2.0...
  VERSION_BASE: "893a7a569239b7f4beda00f9f755b29bab603cc7"

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar versión en config.xml
        run: |
          COUNT=$(git rev-list --first-parent --count "$VERSION_BASE"..HEAD)
          MINOR=$((COUNT - 1))
          if [ "$MINOR" -lt 0 ]; then MINOR=0; fi
          APP_VERSION="2.${MINOR}.0"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$APP_VERSION\"/" index.html
          grep -q "const APP_VERSION = \"$APP_VERSION\"" index.html || { echo "ERROR: no se pudo actualizar APP_VERSION"; exit 1; }
          VERSION="$APP_VERSION"
          echo "Nueva versión: $VERSION"
          VERSION="$VERSION" perl -0pi -e 's/(<widget\b[^>]*?\sversion=")[^"]*(")/$1$ENV{VERSION}$2/s' tizen/config.xml
          grep -q "version=\"$VERSION\"" tizen/config.xml || { echo "ERROR: no se pudo actualizar la versión en config.xml"; exit 1; }
          grep -n 'version=' tizen/config.xml

      - name: Empaquetar .wgt unsigned
        run: |
          # La app va directamente como index.html dentro del .wgt (sin lanzador
          # que redirige a app.html): funciona igual en el TV real y en emuladores
          # web, donde una navegación relativa daba 404.
          cp index.html tizen/index.html
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt

      - name: Crear o actualizar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: OsmTwich v${{ env.APP_VERSION }}
          files: OsmTwich.wgt
          body: |
            Versión: ${{ env.APP_VERSION }}

            ## Cambios
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
