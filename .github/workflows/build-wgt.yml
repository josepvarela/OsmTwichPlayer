name: Build Tizen .wgt

on:
  push:
    branches: [main]
    paths:
      - "tizen/**"
      - "index.html"
      - ".github/workflows/build-wgt.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar versión en config.xml
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "Nueva versión: $VERSION"
          sed -i -E "s/(<widget[^>]*version=\")([^\"]*)(\".*)/\1${VERSION}\3/" tizen/config.xml
          grep 'version=' tizen/config.xml

      - name: Empaquetar .wgt unsigned
        run: |
          # La app va directamente como index.html dentro del .wgt (sin lanzador
          # que redirige a app.html): funciona igual en el TV real y en emuladores
          # web, donde una navegación relativa daba 404.
          cp index.html tizen/index.html
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt

      - name: Crear Release (solo en push a main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OsmTwich TV v1.0.${{ github.run_number }} (unsigned)
          files: OsmTwich.wgt
          body: |
            Unsigned .wgt package

            Versión: 1.0.${{ github.run_number }}

            ## Cambios
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
