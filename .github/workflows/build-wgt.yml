name: Build Tizen .wgt

on:
  push:
    branches: [main]
    paths:
      - "tizen/**"
      - "index.html"
      - "api/**"
      - ".github/workflows/build-wgt.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Versión automática: 1.<N>, donde N = cantidad de commits del repo.
  # Sube sola con cualquier cambio de código. Si quieres que el próximo build
  # sea 1.1, pon aquí (cantidad actual de commits - 1).
  VERSION_OFFSET: "157"

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar versión en config.xml
        run: |
          # Versión automática 1.<commits>; se copia también a APP_VERSION
          # dentro de index.html (para mostrarla en Ajustes).
          # Tizen pide formato x.y.z, por eso se le agrega ".0".
          COUNT=$(git rev-list --count HEAD)
          APP_VERSION="1.$((COUNT - VERSION_OFFSET))"
          sed -i -E "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$APP_VERSION\"/" index.html
          grep -q "const APP_VERSION = \"$APP_VERSION\"" index.html || { echo "ERROR: no se pudo actualizar APP_VERSION"; exit 1; }
          VERSION="${APP_VERSION}.0"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Nueva versión: $VERSION"
          # <widget ...> ocupa varias líneas en config.xml, por eso se usa perl -0
          # (modo multilínea); con sed línea a línea nunca coincidía y quedaba 1.0.0.
          VERSION="$VERSION" perl -0pi -e 's/(<widget\b[^>]*?\sversion=")[^"]*(")/$1$ENV{VERSION}$2/s' tizen/config.xml
          grep -q "version=\"$VERSION\"" tizen/config.xml || { echo "ERROR: no se pudo actualizar la versión en config.xml"; exit 1; }
          grep -n 'version=' tizen/config.xml

      - name: Empaquetar .wgt unsigned
        run: |
          # La app va directamente como index.html dentro del .wgt (sin lanzador
          # que redirige a app.html): funciona igual en el TV real y en emuladores
          # web, donde una navegación relativa daba 404.
          cp index.html tizen/index.html
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt

      - name: Crear Release (solo en push a main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: OsmTwich TV v${{ env.APP_VERSION }} (unsigned)
          files: OsmTwich.wgt
          body: |
            Versión: ${{ env.APP_VERSION }}

            ## Cambios
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
