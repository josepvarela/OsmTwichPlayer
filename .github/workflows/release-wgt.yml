name: Release Tizen .wgt

on:
  workflow_run:
    workflows: ["Build Tizen .wgt"]
    types: [completed]

permissions:
  contents: write

jobs:
  release-wgt:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar el .wgt del run anterior
        uses: actions/download-artifact@v4
        with:
          name: OsmTwich-wgt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wgt-${{ github.event.workflow_run.run_number }}
          name: OsmTwich TV ${{ github.event.workflow_run.run_number }} (sin firmar)
          files: OsmTwich.wgt
          body: |
            Paquete .wgt sin firmar, generado automáticamente desde tizen/.
            Para instalar en un Samsung TV real: abrí este proyecto en Tizen
            Studio, generá tu certificado de autor/distribuidor (Certificate
            Manager) y usá "Build Signed Package" antes de instalar, o
            "Run As > Tizen Web Application" con el TV en modo desarrollador
            conectado por IP, que firma y despliega en un solo paso.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
