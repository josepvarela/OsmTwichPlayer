name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "capacitor/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # package.json fija Capacitor 8 (minSdk 24 / target 36 / Node 22 / Java 21),
      # el mismo que generó el APK que sí instala en el TV box.
      - name: Instalar dependencias de Capacitor
        run: npm install --package-lock=false

      # La app lleva el index.html del repo DENTRO del APK (como el .wgt),
      # ya no abre la web remota.
      - name: Copiar index.html del repo como app local
        run: |
          rm -rf www
          mkdir -p www
          cp ../index.html www/index.html
          # hls.js: el WebView de Android no reproduce HLS nativo (error 4)
          test -f node_modules/hls.js/dist/hls.min.js || { echo "ERROR: falta hls.js (npm install)"; exit 1; }
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          # En Capacitor la página corre en https://localhost, así que las
          # rutas /api/... relativas no existen: se apunta al backend de Vercel.
          sed -i 's#location.protocol === "file:" || !location.hostname#location.protocol === "file:" || !location.hostname || !!window.Capacitor#' www/index.html
          grep -q '!!window.Capacitor) ?' www/index.html || { echo "ERROR: no se pudo parchear API_BASE en index.html"; exit 1; }

      # "cap add android" genera el proyecto Gradle completo en capacitor/android
      # a partir de capacitor.config.json — no hace falta tenerlo commiteado.
      - name: Generar proyecto Android
        run: npx cap add android

      - name: Forzar minSdk 24 / target 36 / compile 36
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/; s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/' android/variables.gradle
          cat android/variables.gradle

      - name: Generar ícono del APK
        # Toma capacitor/assets/icon.png (idealmente 1024x1024) y genera
        # todos los tamaños/mipmaps de Android (legacy + adaptive icon).
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0e0e10" --iconBackgroundColorDark "#0e0e10"

      - name: Sincronizar configuración/plugins
        run: npx cap sync android

      - name: Forzar orientación horizontal (landscape) en el manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:screenOrientation="landscape"' "$MANIFEST"; then
            echo "Ya tiene screenOrientation=landscape, no hace falta tocarlo."
          else
            sed -i '/android:name="\.MainActivity"/a\            android:screenOrientation="landscape"' "$MANIFEST"
          fi

      - name: Compatibilidad con TV box sin táctil (manifest)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for FEATURE in \
            "android.hardware.touchscreen" \
            "android.hardware.faketouch" \
            "android.hardware.microphone" \
            "android.hardware.camera" \
            "android.hardware.camera.autofocus" \
            "android.software.leanback"
          do
            if grep -q "\"$FEATURE\"" "$MANIFEST"; then
              echo "Ya declarada: $FEATURE"
            else
              sed -i "/<application/i\\    <uses-feature android:name=\"$FEATURE\" android:required=\"false\" />" "$MANIFEST"
            fi
          done

      # Para que la app aparezca en el launcher de Android TV / TV box:
      # categoría LEANBACK_LAUNCHER en la actividad principal + banner.
      - name: Aparecer en el launcher de TV (LEANBACK_LAUNCHER + banner)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q 'LEANBACK_LAUNCHER' "$MANIFEST"; then
            echo "Ya tiene LEANBACK_LAUNCHER."
          else
            sed -i '/android.intent.category.LAUNCHER"/a\                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' "$MANIFEST"
          fi
          # Banner 16:9 (640x360) para el launcher de TV
          mkdir -p android/app/src/main/res/drawable
          cp assets/banner.png android/app/src/main/res/drawable/banner.png
          if ! grep -q 'android:banner=' "$MANIFEST"; then
            sed -i 's#<application#<application android:banner="@drawable/banner"#' "$MANIFEST"
          fi
          grep -n -E "LAUNCHER|banner|uses-feature|screenOrientation" "$MANIFEST"

      # Keystore FIJO commiteado en capacitor/debug.keystore: todos los builds
      # salen con la misma firma y se pueden instalar uno encima del otro
      # (antes cada build generaba un keystore nuevo en el runner).
      - name: Usar keystore debug fijo
        run: |
          test -f debug.keystore || { echo "ERROR: falta capacitor/debug.keystore en el repo"; exit 1; }
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - uses: android-actions/setup-android@v3
        with:
          # Sin el paquete legacy "tools" (ya no existe en el repositorio del SDK).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK debug
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          # Descargá el APK desde la pestaña "Summary" de este run de Actions
          # (sección Artifacts). Viene dentro de un .zip: hay que extraerlo.
