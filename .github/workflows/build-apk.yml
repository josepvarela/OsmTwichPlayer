name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "capacitor/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Capacitor
        run: npm install

      # "cap add android" genera el proyecto Gradle completo en capacitor/android
      # a partir de capacitor.config.json — no hace falta tenerlo commiteado.
      - name: Generar proyecto Android
        run: npx cap add android

      - name: Subir minSdkVersion a 21 (mínimo real con AndroidX)
        # Capacitor usa librerías de AndroidX, que EXIGEN minSdkVersion >= 21
        # en cualquier app que las use — si se pone más bajo (probamos con
        # 16 para un TV box viejo), el "manifest merger" de Gradle corta la
        # build con un error de conflicto de minSdkVersion entre la app y
        # esas librerías. No hay forma de bajar de 21 con este stack: un TV
        # box con Android más viejo que eso (5.0) directamente no puede
        # instalar apps hechas con Capacitor, sin importar qué se ajuste acá.
        run: sed -i 's/minSdkVersion = [0-9]\+/minSdkVersion = 21/' android/variables.gradle

      - name: Generar ícono del APK
        # Toma capacitor/assets/icon.png (idealmente 1024x1024) y genera
        # todos los tamaños/mipmaps de Android (legacy + adaptive icon).
        # Igual que el manifest, esto hay que rehacerlo en cada build
        # porque android/ se genera de cero con "cap add android".
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0e0e10" --iconBackgroundColorDark "#0e0e10"

      - name: Sincronizar configuración/plugins
        run: npx cap sync android

      - name: Forzar orientación horizontal (landscape) en el manifest
        # "cap add android" genera el AndroidManifest.xml de cero en cada
        # build (no está commiteado), así que el bloqueo de orientación
        # nativo hay que reinyectarlo acá. Esto complementa el intento por
        # JS (force-landscape-v60 en osmtwich.html): el manifest es la
        # fuente de verdad real para Android; el JS es solo un respaldo
        # para WebViews que sí respetan la Screen Orientation API.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:screenOrientation="landscape"' "$MANIFEST"; then
            echo "Ya tiene screenOrientation=landscape, no hace falta tocarlo."
          else
            sed -i '/android:name="\.MainActivity"/a\            android:screenOrientation="landscape"' "$MANIFEST"
            grep -n 'MainActivity' -A1 "$MANIFEST"
          fi

      - name: Compatibilidad con TV box sin táctil (manifest)
        # Muchos TV box de gama baja no tienen pantalla táctil (ni GPS,
        # cámara, etc.). Por defecto Android/aapt puede marcar
        # "android.hardware.touchscreen" como REQUERIDO, y el instalador
        # rechaza la instalación en cualquier dispositivo que no cumpla un
        # <uses-feature required="true">. Declarar estas features como NO
        # requeridas es la causa más común de "no se instala" en TV box y
        # no afecta en nada a celulares/tablets normales.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for FEATURE in \
            "android.hardware.touchscreen" \
            "android.hardware.faketouch" \
            "android.hardware.microphone" \
            "android.hardware.camera" \
            "android.hardware.camera.autofocus" \
            "android.software.leanback"
          do
            if grep -q "\"$FEATURE\"" "$MANIFEST"; then
              echo "Ya declarada: $FEATURE"
            else
              sed -i "/<application/i\\    <uses-feature android:name=\"$FEATURE\" android:required=\"false\" />" "$MANIFEST"
            fi
          done
          grep -n "uses-feature" "$MANIFEST"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # Por defecto esta acción intenta instalar el paquete legacy
          # "tools", que Google sacó del repositorio del SDK — por eso
          # fallaba con "Failed to find package 'tools'". Pidiendo acá
          # explícitamente solo lo que hace falta para compilar (sin
          # "tools") se evita ese error.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK debug
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          # Sin release automática: descargá el APK desde acá, en la
          # pestaña "Summary" de este run de Actions (sección Artifacts).
