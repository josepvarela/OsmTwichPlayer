/* ==========================================================
   OsmTwich - banner de la barra lateral
   - Abierta: banner completo (fondo negro en temas oscuros, blanco en claro)
   - Contraida: mismo banner sin texto (solo circulo con play)
   - Iconos de la barra alineados con el circulo del banner
   Todo se posiciona de forma absoluta dentro de #sidebar, asi no
   depende del padding ni del ancho real del elemento.
   ========================================================== */
#main-screen {
  --osm-banner-w: 180px;    /* ancho del banner con la barra abierta */
  --osm-banner-x: 14px;     /* separacion al borde izquierdo de la pantalla */
  --osm-banner-y: 8px;      /* separacion arriba */
  --osm-ring-cx: 0.2335;    /* centro del circulo dentro del banner (fraccion del ancho) */
  --osm-icon: 32px;         /* tamano de los iconos de la barra */
  --osm-sb-shift: 24px;     /* la barra abierta esta desplazada -24px */
  --osm-col-w: 62px;        /* ancho de la barra contraida */
  --osm-col-mark: 44px;     /* tamano del icono de la barra contraida */
}

  width: var(--osm-banner-w) !important;
  min-width: var(--osm-banner-w) !important;
  max-width: var(--osm-banner-w) !important;

#main-screen:not(.sidebar-collapsed) #sidebar #nav-list {
  position: absolute !important;
  left: 0 !important;
  top: calc(var(--osm-banner-y) + var(--osm-banner-w) * 9 / 16 + 14px) !important;
  width: 240px !important;
  margin: 0 !important;
  padding: 0 !important;
}
#main-screen:not(.sidebar-collapsed) #sidebar #nav-list li,
#main-screen:not(.sidebar-collapsed) #sidebar #nav-list #search-nav-item {
  flex: 0 0 240px !important;
  width: 240px !important;
  min-width: 240px !important;
  max-width: 240px !important;
  margin: 0 !important;
}
#main-screen:not(.sidebar-collapsed) #sidebar #nav-list li .nav-icon,
#main-screen:not(.sidebar-collapsed) #sidebar #nav-list #search-nav-item .nav-icon {
  left: calc(var(--osm-banner-x) + var(--osm-sb-shift) + var(--osm-banner-w) * var(--osm-ring-cx) - var(--osm-icon) / 2) !important;
}
#main-screen:not(.sidebar-collapsed) #sidebar #nav-list li .nav-label,
#main-screen:not(.sidebar-collapsed) #sidebar #nav-list #search-nav-item .nav-label {
  left: calc(var(--osm-banner-x) + var(--osm-sb-shift) + var(--osm-banner-w) * var(--osm-ring-cx) + var(--osm-icon) / 2 + 12px) !important;
}

/* ---------- BARRA CONTRAIDA ---------- */
html #main-screen.sidebar-collapsed #sidebar #sidebar-logo {
  position: absolute !important;
  top: 12px !important;
  left: 0 !important;
  width: var(--osm-col-w) !important;
  min-width: var(--osm-col-w) !important;
  max-width: var(--osm-col-w) !important;
  height: var(--osm-col-mark) !important;
  min-height: var(--osm-col-mark) !important;
  margin: 0 !important;
  padding: 0 !important;
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  justify-content: center !important;
  overflow: visible !important;
}
html #main-screen.sidebar-collapsed #sidebar #sidebar-logo::before {
  content: "" !important;
  display: block !important;
  flex: 0 0 var(--osm-col-mark) !important;
  width: var(--osm-col-mark) !important;
  min-width: var(--osm-col-mark) !important;
  max-width: var(--osm-col-mark) !important;
  height: var(--osm-col-mark) !important;
  min-height: var(--osm-col-mark) !important;

        const idx = rows.findIndex(row => row.dataset.sectionId === id);
        if (idx === -1) return;
        const referenceRow = rows[idx - 1] || rows[idx];
        const contentRect = content.getBoundingClientRect();
        const rowRect = referenceRow.getBoundingClientRect();
        const topSafeMargin = parseFloat(getComputedStyle(content).paddingTop) || 0;
        const k = (content.offsetHeight ? contentRect.height / content.offsetHeight : 1) || 1;
        const delta = (rowRect.top - contentRect.top) / k - topSafeMargin;

            content.scrollHeight - content.clientHeight,
            content.scrollTop + delta

    });
}

async function getStreamerProfileMap(streams) {
    const logins = [...new Set(
        streams.map(s => s.user_login).filter(Boolean)
    )];
    const map = new Map();
    if (!logins.length) return map;
    const CHUNK_SIZE = 100;
    for (let i = 0; i < logins.length; i += CHUNK_SIZE) {
        const chunk = logins.slice(i, i + CHUNK_SIZE);
        try {
            const params = chunk
                .map(login => `login=${encodeURIComponent(login)}`)
                .join("&");
            const response = await helixGet(`users?${params}`);
            (response.data || []).forEach(user => {
                map.set(String(user.login).toLowerCase(), user.profile_image_url || "");
            });
        } catch (error) {
            console.warn("No se pudieron cargar las fotos de perfil:", error);
        }
    }
    return map;
}

const ROW_MORE_PAGE = 20, ROW_MORE_MAX = 40, GAME_ROW_MAX = 20;

    const obs = new IntersectionObserver(entries => {
        if (entries.some(e => e.isIntersecting)) loadMoreTiles(rowId);

async function loadMoreTiles(rowId) {

function registerStreamPaging(rowId, query, cursor, firstStreams) {
    const seen = new Set(firstStreams.map(s => s.id));
    let cur = cursor;
    registerRowMore(rowId, async function () {
        if (!cur) return { nodes: [], done: true };
        const page = await fetchStreamsPage(query, ROW_MORE_PAGE, cur);
        cur = page.cursor;
        const room = Math.max(0, ROW_MORE_MAX - seen.size);
        const fresh = page.streams.filter(s => !seen.has(s.id)).slice(0, room);
        fresh.forEach(s => seen.add(s.id));
        return { nodes: await streamsToTiles(fresh), done: !cur || seen.size >= ROW_MORE_MAX };
    });
}

const LAZY_CHUNK_SIZE = 12;
const lazyRowState = new Map(); // sectionId -> { streams, loaded, profileMap, loading }

function setupLazyRowLoad(sectionId, streams) {
    const track = document.getElementById(`track-${sectionId}`);
    if (!track) return;
    track.innerHTML = "";
    lazyRowState.set(sectionId, {
        streams: streams.slice(),
        loaded: 0,
        profileMap: new Map(),
        loading: false,
        cursor: (streams && streams.cursor) || "",
        done: false
    });
    loadMoreForRow(sectionId);

    const row = track.closest(".section-row");
    if (!row) return;
    const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) loadMoreForRow(sectionId);
        });
    }, { root: null, rootMargin: "200px" });
    obs.observe(track);

    track.addEventListener("scroll", () => {
        const st = lazyRowState.get(sectionId);
        if (!st || st.loading) return;
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 400) {
            loadMoreForRow(sectionId);
        }
    }, { passive: true });
}

async function loadMoreForRow(sectionId) {
    const st = lazyRowState.get(sectionId);
    if (!st || st.loading) return;
    if (st.loaded >= st.streams.length) {
        if (st.done || !st.cursor || st.streams.length >= GAME_ROW_MAX) return;
        st.loading = true;
        try {
            const gid = sectionId.replace(/^game-/, "");
            const data = await helixGet(`streams?game_id=${encodeURIComponent(gid)}&first=${ROW_MORE_PAGE}&after=${encodeURIComponent(st.cursor)}`);
            const seen = new Set(st.streams.map(x => x.id));
            const fresh = (data.data || []).filter(x => !seen.has(x.id));
            fresh.forEach(x => st.streams.push(x));
            st.cursor = (data.pagination && data.pagination.cursor) || "";
            if (!st.cursor || !fresh.length) st.done = true;
        } catch (_) { st.done = true; }
        st.loading = false;
        if (lazyRowState.get(sectionId) !== st) return;
        if (st.loaded >= st.streams.length) return;
    }
    st.loading = true;
    const track = document.getElementById(`track-${sectionId}`);
    if (!track) { st.loading = false; return; }
    const chunk = st.streams.slice(st.loaded, Math.min(st.loaded + LAZY_CHUNK_SIZE, GAME_ROW_MAX));
    if (!chunk.length) { st.loading = false; return; }

    const chunkProfiles = await getStreamerProfileMap(chunk);
    if (lazyRowState.get(sectionId) !== st) return;
    chunkProfiles.forEach((v, k) => st.profileMap.set(k, v));
    chunk.forEach(s => {
        const profile = st.profileMap.get(String(s.user_login || "").toLowerCase()) || "";
        track.appendChild(buildStreamTile(s, profile));
    });
    st.loaded += chunk.length;
    st.loading = false;

    if ((st.loaded < st.streams.length || (st.cursor && !st.done)) && track.scrollWidth <= track.clientWidth + 10) {
        loadMoreForRow(sectionId);
    }
}

function formatLastLiveLabel(iso) {
    if (!iso) return "Sin transmisiones recientes";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return "Sin transmisiones recientes";
    const diffMs = Math.max(0, Date.now() - then);
    const minute = 60000, hour = 3600000, day = 86400000, month = day * 30, year = day * 365;
    let text;
    if (diffMs < hour) {
        const m = Math.max(1, Math.round(diffMs / minute));
        text = `hace ${m} min`;
    } else if (diffMs < day) {
        const h = Math.round(diffMs / hour);
        text = `hace ${h} h`;
    } else if (diffMs < day * 2) {
        text = "ayer";
    } else if (diffMs < month) {
        const d = Math.round(diffMs / day);
        text = `hace ${d} días`;
    } else if (diffMs < year) {
        const mo = Math.round(diffMs / month);
        text = `hace ${mo} ${mo === 1 ? "mes" : "meses"}`;
    } else {
        const y = Math.round(diffMs / year);
        text = `hace ${y} ${y === 1 ? "año" : "años"}`;
    }
    return `Última vez en vivo: ${text}`;
}

function setChannelBannerFromImage(url) {
    const root = document.getElementById("results-screen");
    const banner = document.getElementById("channel-banner");
    if (!url || !root || !banner) return;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
        try {
            const c = document.createElement("canvas");
            const ctx = c.getContext("2d", {willReadFrequently:true});
            c.width = 24; c.height = 24;
            ctx.drawImage(img, 0, 0, c.width, c.height);
            const data = ctx.getImageData(0, 0, c.width, c.height).data;
            let r=0,g=0,b=0,n=0;
            for (let i=0;i<data.length;i+=4) {
                if (data[i+3] < 120) continue;
                r += data[i]; g += data[i+1]; b += data[i+2]; n++;
            }
            if (!n) return;
            r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
            const max=Math.max(r,g,b), min=Math.min(r,g,b);
            if (max-min < 18) { r=Math.min(255,r+18); b=Math.min(255,b+30); }
            const accent=`rgb(${r}, ${g}, ${b})`;
            root.style.setProperty("--channel-accent", accent);
            banner.style.backgroundImage = `linear-gradient(180deg, rgba(${r},${g},${b},.88), rgba(15,15,18,.98))`;
            banner.style.backgroundColor = accent;
        } catch (_) {}
    };
    img.src = url;
}

let tokenRequestInFlight = null;
async function getAppToken() {
    if (twitchAppToken && twitchTokenExpiresAt - Date.now() > 60000) return twitchAppToken;
    if (tokenRequestInFlight) return tokenRequestInFlight;
    tokenRequestInFlight = (async () => {
        try {
            const res = await fetch(TWITCH_TOKEN_ENDPOINT, { cache: "no-store" });
            const data = await res.json();
            if (!res.ok || !data.access_token) {
                console.error("Twitch token error:", data.message || res.status);
                return null;
            }
            twitchAppToken = data.access_token;
            TWITCH_CLIENT_ID = data.client_id || TWITCH_CLIENT_ID;
            twitchTokenExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
            return twitchAppToken;
        } catch (e) {
            console.error(e);
            return null;
        } finally {
            tokenRequestInFlight = null;
        }
    })();
    return tokenRequestInFlight;
}
async function helixGet(path) {
    const token = await getAppToken();
    if (!token) return { data: [] };
    try {
        const res = await fetch(`https://api.twitch.tv/helix/${path}`, {
            headers: { "Client-Id": TWITCH_CLIENT_ID, "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
            twitchAppToken = null;
            twitchTokenExpiresAt = 0;
            const fresh = await getAppToken();
            if (!fresh) return { data: [] };
            const retry = await fetch(`https://api.twitch.tv/helix/${path}`, {
                headers: { "Client-Id": TWITCH_CLIENT_ID, "Authorization": `Bearer ${fresh}` }
            });
            return await retry.json();
        }
        return await res.json();
    } catch (e) { console.error(e); return { data: [] }; }
}

        const res = await fetch(`${API_BASE}/api/twitch-device-start?scopes=${encodeURIComponent(TWITCH_SCOPES)}`, { cache: "no-store" });
        const data = await res.json();
        if (stale()) return;
        if (!res.ok || !data.device_code) {

            timer: null
        };
        renderAccountOverlay("qr", { verification_uri: data.verification_uri, user_code: data.user_code });
        deviceFlowState.timer = setTimeout(pollDeviceLogin, deviceFlowState.interval);

async function pollDeviceLogin() {
    if (!deviceFlowState) return;
    if (Date.now() > deviceFlowState.expiresAt) {
        deviceFlowState = null;
        renderAccountOverlay("qr-error", "El código QR expiró. Probá de nuevo.");
        return;
    }
    const current = deviceFlowState;
    try {
        const res = await fetch(`${API_BASE}/api/twitch-device-poll?device_code=${encodeURIComponent(current.device_code)}`, { cache: "no-store" });
        const data = await res.json();
        if (res.ok && data.access_token) {
            deviceFlowState = null;
            saveTwitchUser({
                access_token: data.access_token,
                refresh_token: data.refresh_token || null,
                expires_at: Date.now() + (Number(data.expires_in) || 14400) * 1000,
                user_id: data.user_id || null,
                login: data.login || null,
                display_name: data.display_name || data.login || null,
                profile_image_url: data.profile_image_url || null
            });
            renderAccountOverlay("logged-in");
            if (currentScreen === "main" && !panelFocused && activePanel === "account") setFocus("nav", navIndex);
            return;
        }
        const msg = String(data.message || "");
        if (msg === "authorization_pending" || msg === "") {
            current.timer = setTimeout(pollDeviceLogin, current.interval);
            return;
        }
        deviceFlowState = null;
        renderAccountOverlay("qr-error", "No se pudo completar el login (" + msg + ").");
    } catch (e) {
        current.timer = setTimeout(pollDeviceLogin, current.interval);
    }
}
function logoutTwitch() {
    stopDeviceLogin();
    clearTwitchUser();

}

function renderDonatePanel() {
    const box = document.getElementById("account-box");
    if (!box) return;
    accountOverlayView = "menu";
    box.classList.remove("is-settings");
    box.classList.add("is-donate");
    const showPaypal = donateMethodSelected === "paypal";
    box.innerHTML = `

        <div class="donate-qrs">
            <div class="donate-methods" role="group" aria-label="Métodos de donación">
                <button class="account-btn donate-method-btn${showPaypal ? " primary" : ""}" data-nav-btn data-action="donate-select" data-method="paypal" aria-pressed="${showPaypal}">PayPal</button>
                <button class="account-btn donate-method-btn${!showPaypal ? " primary" : ""}" data-nav-btn data-action="donate-select" data-method="nequi" aria-pressed="${!showPaypal}">Nequi</button>
            </div>
            <div class="donate-qr-preview">
                <img class="account-qr donate-qr" src="${showPaypal ? DONATE_QR_SRC : DONATE_QR_NEQUI_SRC}" alt="Código QR de ${showPaypal ? "PayPal" : "Nequi"}">
            </div>
        </div>`;
    wireAccountButtons();
}
function getDeviceInfo() {
    const info = { platform: "web", model: "", firmware: "", tizen: "", screen: (window.innerWidth || 0) + "x" + (window.innerHeight || 0), ua: String(navigator.userAgent || "").slice(0, 200) };
    try {
        if (window.Capacitor && typeof window.Capacitor.getPlatform === "function") info.platform = "capacitor-" + window.Capacitor.getPlatform();
        if (window.tizen) info.platform = "tizen";
        if (window.webapis && window.webapis.productinfo) {
            const pi = window.webapis.productinfo;
            try { info.model = pi.getRealModel() || pi.getModel() || ""; } catch (_) { try { info.model = pi.getModel() || ""; } catch (__) {} }
            try { info.firmware = pi.getFirmware() || ""; } catch (_) {}
        }
        const m = /Tizen\s*([\d.]+)/i.exec(navigator.userAgent || "");
        if (m) info.tizen = m[1];
    } catch (_) {}
    return info;
}
function showFeedbackToast(msg) {
    let el = document.getElementById("feedback-toast");
    if (!el) {
        el = document.createElement("div");
        el.id = "feedback-toast";
        el.style.cssText = "position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);background:rgba(24,24,27,.95);color:#fff;padding:14px 26px;border-radius:10px;font-size:clamp(16px,1.8vw,22px);z-index:2147483647;pointer-events:none;opacity:0;transition:opacity .2s ease;max-width:90vw;text-align:center;";
        (document.getElementById("tv-scale-root") || document.body).appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = "0"; }, 3200);
}
async function sendFeedback(text) {
    text = String(text || "").trim();
    if (text.length < 5) { showFeedbackToast("Escribe un comentario un poco más largo."); return; }
    let last = 0;
    try { last = Number(localStorage.getItem("osmtwich-feedback-last") || 0); } catch (_) {}
    if (Date.now() - last < 60000) { showFeedbackToast("Espera un minuto antes de enviar otro comentario."); return; }
    showFeedbackToast("Enviando comentario…");
    try {
        const res = await fetch(`${API_BASE}/api/feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },

function handleAccountOverlayKeys(keyCode, e) {

        const rows = Array.from(document.querySelectorAll("#account-box .settings-row-account")).map(r => ({

            items: Array.from(r.querySelectorAll(".settings-options button[data-value]"))

        const closeEl = document.querySelector('#account-box [data-action="close"]');
        if (closeEl) rows.push({ vertical: false, items: [closeEl] });

        let ri = -1, ci = -1;
        const cur = document.activeElement;
        rows.forEach((r, a) => {
            let k = r.items.indexOf(cur);
            if (k === -1 && ri === -1) k = r.items.findIndex(el => el.classList.contains("focused"));
            if (k !== -1 && ri === -1) { ri = a; ci = k; }
        });
        if (ri === -1) { ri = 0; ci = 0; }
        const focusAt = (a, k) => {
            const el = rows[a].items[k];
            document.querySelectorAll("#account-box .focused").forEach(b => b.classList.remove("focused"));
            el.classList.add("focused");
            el.focus({ preventScroll: true });
            el.scrollIntoView({ block: "nearest" });
        };
        const go = (a, k) => focusAt(a, Math.max(0, Math.min(k, rows[a].items.length - 1)));

        const data = await helixGet(`streams?first=${first}${query}${cursor ? "&after=" + encodeURIComponent(cursor) : ""}`);

let twitchSdkPromise = null;
function ensureTwitchSDK() {
    if (window.Twitch && typeof window.Twitch.Player === "function") {
        return Promise.resolve();
    }
    if (twitchSdkPromise) return twitchSdkPromise;
    twitchSdkPromise = new Promise((resolve, reject) => {
        const existing = document.querySelector('script[src*="embed.twitch.tv/embed/v1.js"]');
        if (existing) {
            existing.addEventListener("load", () => resolve(), { once: true });
            existing.addEventListener("error", () => reject(new Error("No se pudo cargar Twitch Embed")), { once: true });
            const timer = setInterval(() => {
                if (window.Twitch && typeof window.Twitch.Player === "function") {
                    clearInterval(timer);
                    resolve();
                }
            }, 100);
            setTimeout(() => {
                clearInterval(timer);
                if (!(window.Twitch && typeof window.Twitch.Player === "function")) {
                    reject(new Error("Twitch Embed no está disponible"));
                }
            }, 10000);
            return;
        }
        const script = document.createElement("script");
        script.src = "https://embed.twitch.tv/embed/v1.js";
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("No se pudo cargar Twitch Embed"));
        document.head.appendChild(script);
    });
    return twitchSdkPromise;
}

function waitForPlaybackStart(timeoutMs) {

        try {
            if (!twitchPlayer.isPaused()) { resolve(true); return; }
        } catch (_) {}
        let done = false;
        const finish = (ok) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            try { twitchPlayer.removeEventListener(Twitch.Player.PLAYING, onPlaying); } catch (_) {}
            resolve(ok);
        };
        const onPlaying = () => finish(true);

        try { twitchPlayer.addEventListener(Twitch.Player.PLAYING, onPlaying); } catch (_) {
            finish(false);
        }
    });

(function(){
    var BASELINE_WIDTH = 1920;
    var BASELINE_HEIGHT = 1080;
    var isTizenApp = !!(window.tizen && window.tizen.application);
    if (!isTizenApp) return;
    function getViewportSize(){
        var w = window.innerWidth || document.documentElement.clientWidth || (window.screen && window.screen.width);
        var h = window.innerHeight || document.documentElement.clientHeight || (window.screen && window.screen.height);
        return { w: w, h: h };
    }
    function wrapBody(){
        if (document.getElementById('tv-scale-root')) return document.getElementById('tv-scale-root');
        var root = document.createElement('div');
        root.id = 'tv-scale-root';
        while (document.body.firstChild) {
            root.appendChild(document.body.firstChild);
        }
        document.body.appendChild(root);
        return root;
    }
    function applyTvScale(){
        var size = getViewportSize();
        if (!size.w || !size.h) return;
        var root = wrapBody();
        var scaleX = size.w / BASELINE_WIDTH;
        var scaleY = size.h / BASELINE_HEIGHT;
        var scale = Math.min(scaleX, scaleY);
        root.style.transform = 'scale(' + scale + ')';
        document.documentElement.setAttribute('data-tv-scaled', '1');
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTvScale);
    } else {
        applyTvScale();
    }
    window.addEventListener('resize', applyTvScale);
    window.addEventListener('orientationchange', applyTvScale);
    window.addEventListener('load', applyTvScale);
    setTimeout(applyTvScale, 400);
    setTimeout(applyTvScale, 1500);
})();

        try { window.close(); } catch (e) {}

    function isAtRoot(){
        try {
            if (typeof currentScreen === 'undefined' || currentScreen !== 'main') return false;
            var acc = document.getElementById('account-overlay');
            var sea = document.getElementById('home-search-overlay');
            if (acc && acc.classList.contains('visible') && panelFocused) return false;
            if (sea && sea.classList.contains('visible')) return false;

            if (typeof focusZone !== 'undefined' && focusZone === 'content' &&

    function handleBackPress(evt){

            clearTimeout(exitTimer);
            exitApp();

<script id="android-back-button-v1">
(function () {
    if (!window.Capacitor) return;
    var DOUBLE_BACK_WINDOW_MS = 2000;
    var lastBackPressAt = 0;
    var toastTimer = null;
    function showExitToast() {
        var el = document.getElementById("android-exit-toast");
        if (!el) {
            el = document.createElement("div");
            el.id = "android-exit-toast";
            el.textContent = "Presiona atrás de nuevo para salir";
            el.style.cssText =
                "position:fixed;left:50%;bottom:48px;transform:translateX(-50%);" +
                "background:rgba(24,24,27,.95);color:#fff;font-size:15px;" +
                "padding:10px 18px;border-radius:8px;z-index:99999;" +
                "opacity:0;transition:opacity .15s ease;pointer-events:none;";
            document.body.appendChild(el);
        }
        el.style.opacity = "1";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            el.style.opacity = "0";
        }, DOUBLE_BACK_WINDOW_MS);
    }
    function isAtRootScreen() {
        var accountOverlay = document.getElementById("account-overlay");
        var searchOverlay = document.getElementById("home-search-overlay");
        var accountOpen = accountOverlay && accountOverlay.classList.contains("visible") && panelFocused;
        var searchOpen = searchOverlay && searchOverlay.classList.contains("visible");
        return typeof currentScreen !== "undefined" && currentScreen === "main" && !accountOpen && !searchOpen;
    }
    function handleAndroidBack(e) {
        if (window.OskKeyboard && OskKeyboard.isOpen()) { OskKeyboard.close(); return; }
        if (window.OsmPicker && OsmPicker.isOpen()) { OsmPicker.close(); return; }
        var accountOverlay = document.getElementById("account-overlay");
        if (accountOverlay && accountOverlay.classList.contains("visible") && panelFocused) {
            closeAccountOverlay();
            return;
        }
        var searchOverlay = document.getElementById("home-search-overlay");
        if (searchOverlay && searchOverlay.classList.contains("visible")) {
            closeHomeSearch();
            return;
        }
        if (!isAtRootScreen()) {
            goBack();
            return;
        }
        var now = Date.now();
        if (now - lastBackPressAt < DOUBLE_BACK_WINDOW_MS) {
            window.Capacitor.Plugins.App.exitApp();
        } else {
            lastBackPressAt = now;
            showExitToast();
        }
    }
    if (window.Capacitor.Plugins && window.Capacitor.Plugins.App &&
        typeof window.Capacitor.Plugins.App.addListener === "function") {
        window.Capacitor.Plugins.App.addListener("backButton", handleAndroidBack);
    }
    document.addEventListener("backButton", handleAndroidBack);
})();
</script>
<script id="tv-perf-final-v65">
(function () {
    "use strict";
    try {
        const noop = function () {};
        Object.defineProperty(window, "updateFocusBackground", { value: noop, writable: false, configurable: false });
        Object.defineProperty(window, "clearFocusBackground",  { value: noop, writable: false, configurable: false });
        Object.defineProperty(window, "hideFocusBackground",   { value: noop, writable: false, configurable: false });
        const bg = document.getElementById("focus-background");
        if (bg) bg.remove();
    } catch (e) { console.warn("v65 fondo:", e); }
    document.addEventListener("DOMContentLoaded", function () {
        const chatEl = document.getElementById("chat-messages");
        if (!chatEl) return;
        let pendiente = false;
        new MutationObserver(() => {
            if (pendiente) return;
            pendiente = true;
            requestAnimationFrame(() => {
                chatEl.scrollTop = chatEl.scrollHeight;
                pendiente = false;
            });
        }).observe(chatEl, { childList: true });
    });
    document.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.keyCode !== 39) return;
        const search = document.getElementById("search-nav-item");
        if (!search || document.activeElement !== search) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (typeof focusContentZone === "function") focusContentZone("featured", 0);
    }, true);
    const originalGoBack = typeof goBack === "function" ? goBack : null;
    if (originalGoBack) {
        window.goBack = function () {
            if (typeof currentScreen !== "undefined" && currentScreen === "main") {
                const rows = typeof getVisibleRowIds === "function" ? getVisibleRowIds() : [];
                const firstRow = rows.find(id =>
                    typeof getRowTileCount === "function" && getRowTileCount(id) > 0
                );
                if (focusZone === "content" &&
                    contentRowId === firstRow &&
                    contentTileIndex === 0) {
                    return;
                }
            }
            return originalGoBack.apply(this, arguments);
        };
    }
    document.addEventListener("keydown", function (e) {
        const overlay = document.getElementById("home-search-overlay");
        if (!overlay || !overlay.classList.contains("visible")) return;
        const code = e.keyCode || e.which;
        const isBack = e.key === "Escape" || e.key === "BrowserBack" ||
                       e.key === "GoBack" ||
                       code === 27 || code === 461 || code === 10009;
        if (!isBack) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (typeof closeHomeSearch === "function") closeHomeSearch();
    }, true);
    console.log("[v65] Parches TV aplicados.");
})();
</script>

<script id="sidebar-fit-perf-script-v67">
(function () {
    "use strict";
    var de = document.documentElement;
    var ua = navigator.userAgent || "";
    var lite = true;
    if (lite) de.classList.add("perf-lite");
    if (lite && typeof Object.assign === "function") {
        try {
            ["scrollTo", "scrollBy"].forEach(function (name) {
                var orig = Element.prototype[name];
                if (typeof orig !== "function") return;
                Element.prototype[name] = function (a) {
                    if (a && typeof a === "object" && a.behavior === "smooth") {
                        a = Object.assign({}, a, { behavior: "auto" });
                    }
                    return arguments.length > 1 ? orig.call(this, a, arguments[1]) : orig.call(this, a);
                };
            });
        } catch (e) {}
        try {
            var origSIV = Element.prototype.scrollIntoView;
            Element.prototype.scrollIntoView = function (o) {
                if (o && typeof o === "object" && o.behavior === "smooth") o = Object.assign({}, o, { behavior: "auto" });
                return origSIV.call(this, o);
            };
        } catch (e) {}
    }
    var raf = 0, last = 1;
    function fit() {
        raf = 0;
        try {
            var sb = document.getElementById("sidebar");
            var nl = document.getElementById("nav-list");
            if (!sb || !nl) return;
            var root = document.getElementById("tv-scale-root");
            var scaled = de.hasAttribute("data-tv-scaled") && root;
            var avail = scaled ? root.offsetHeight
                : (window.innerHeight || de.clientHeight || 0);
            var natural = nl.offsetTop + nl.offsetHeight;
            if (!avail || !natural) return;
            var s = Math.max(0.5, Math.min(1, avail / (natural + 16)));
            if (Math.abs(s - last) < 0.005) return;
            last = s;
            de.style.setProperty("--sidebar-fit", s.toFixed(3));
        } catch (e) { console.warn("v67 fit:", e); }
    }
    function schedule() {
        if (raf) return;
        raf = (window.requestAnimationFrame || setTimeout)(fit);
    }
    function init() {
        schedule();
        window.addEventListener("resize", schedule);
        window.addEventListener("orientationchange", function () { setTimeout(schedule, 250); });
        if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule);
        window.addEventListener("load", function () { schedule(); setTimeout(schedule, 600); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
        var nl = document.getElementById("nav-list");
        if (nl && window.MutationObserver) {
            new MutationObserver(schedule).observe(nl, { childList: true });
        }
        var ms = document.getElementById("main-screen");
        if (ms && window.MutationObserver) {
            var wasActive = ms.classList.contains("active");
            new MutationObserver(function () {
                var act = ms.classList.contains("active");
                if (act !== wasActive) { wasActive = act; schedule(); }
            }).observe(ms, { attributes: true, attributeFilter: ["class"] });
        }
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
