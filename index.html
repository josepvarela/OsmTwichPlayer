function addScrollButtons(row, track) {

    right.className = "scroll-btn right";
    right.textContent = "›";
    right.addEventListener("click", () => track.scrollBy({ left: track.clientWidth * 0.8, behavior: "smooth" }));
    row.appendChild(left);
    row.appendChild(right);

function enableDragScroll(track) {

    track.addEventListener("mousedown", (e) => onDown(e.pageX));

async function fetchLastLiveByUserIds(userIds) {
    const map = new Map();
    const unique = [...new Set(userIds.filter(Boolean))];
    if (!unique.length) return map;
    await Promise.all(unique.map(async (id) => {
        try {
            const data = await helixGet(`videos?user_id=${encodeURIComponent(id)}&type=archive&first=1`);
            const v = (data.data || [])[0];
            if (v && v.created_at) map.set(id, v.created_at);
        } catch (e) {   }
    }));
    return map;
}
function formatLastLiveLabel(iso) {
    if (!iso) return "Sin transmisiones recientes";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return "Sin transmisiones recientes";
    const diffMs = Math.max(0, Date.now() - then);
    const minute = 60000, hour = 3600000, day = 86400000, month = day * 30, year = day * 365;
    let text;
    if (diffMs < hour) {
        const m = Math.max(1, Math.round(diffMs / minute));
        text = `hace ${m} min`;
    } else if (diffMs < day) {
        const h = Math.round(diffMs / hour);
        text = `hace ${h} h`;
    } else if (diffMs < day * 2) {
        text = "ayer";
    } else if (diffMs < month) {
        const d = Math.round(diffMs / day);
        text = `hace ${d} días`;
    } else if (diffMs < year) {
        const mo = Math.round(diffMs / month);
        text = `hace ${mo} ${mo === 1 ? "mes" : "meses"}`;
    } else {
        const y = Math.round(diffMs / year);
        text = `hace ${y} ${y === 1 ? "año" : "años"}`;
    }
    return `Última vez en vivo: ${text}`;
}

function setChannelBannerFromImage(url) {
    const root = document.getElementById("results-screen");
    const banner = document.getElementById("channel-banner");
    if (!url || !root || !banner) return;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
        try {
            const c = document.createElement("canvas");
            const ctx = c.getContext("2d", {willReadFrequently:true});
            c.width = 24; c.height = 24;
            ctx.drawImage(img, 0, 0, c.width, c.height);
            const data = ctx.getImageData(0, 0, c.width, c.height).data;
            let r=0,g=0,b=0,n=0;
            for (let i=0;i<data.length;i+=4) {
                if (data[i+3] < 120) continue;
                r += data[i]; g += data[i+1]; b += data[i+2]; n++;
            }
            if (!n) return;
            r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
            const max=Math.max(r,g,b), min=Math.min(r,g,b);
            if (max-min < 18) { r=Math.min(255,r+18); b=Math.min(255,b+30); }
            const accent=`rgb(${r}, ${g}, ${b})`;
            root.style.setProperty("--channel-accent", accent);
            banner.style.backgroundImage = `linear-gradient(180deg, rgba(${r},${g},${b},.88), rgba(15,15,18,.98))`;
            banner.style.backgroundColor = accent;
        } catch (_) {}
    };
    img.src = url;
}

                const a=data[i+3]; if (a < 120) continue;

async function getAppToken() {

async function startRedirectLogin() {

        return;
    }

    const redirectUri = `${API_BASE || location.origin}/api/twitch-auth-callback`;
    const params = new URLSearchParams({

async function startDeviceLogin() {

        const res = await fetch(`${API_BASE}/api/twitch-device-start?scopes=${encodeURIComponent(TWITCH_SCOPES)}`, { cache: "no-store" });
        const data = await res.json();
        if (!res.ok || !data.device_code) {
            renderAccountOverlay("qr-error", data.message || "No se pudo iniciar el login por QR.");
            return;
        }
        deviceFlowState = {
            device_code: data.device_code,
            interval: Math.max(2, Number(data.interval) || 5) * 1000,
            expiresAt: Date.now() + (Number(data.expires_in) || 1800) * 1000,
            timer: null
        };
        renderAccountOverlay("qr", { verification_uri: data.verification_uri, user_code: data.user_code });
        deviceFlowState.timer = setTimeout(pollDeviceLogin, deviceFlowState.interval);
    } catch (e) {
        renderAccountOverlay("qr-error", "No se pudo conectar con Twitch.");
    }
}
async function pollDeviceLogin() {
    if (!deviceFlowState) return;
    if (Date.now() > deviceFlowState.expiresAt) {
        deviceFlowState = null;
        renderAccountOverlay("qr-error", "El código QR expiró. Probá de nuevo.");
        return;
    }
    const current = deviceFlowState;
    try {
        const res = await fetch(`${API_BASE}/api/twitch-device-poll?device_code=${encodeURIComponent(current.device_code)}`, { cache: "no-store" });
        const data = await res.json();
        if (res.ok && data.access_token) {
            deviceFlowState = null;
            saveTwitchUser({
                access_token: data.access_token,
                refresh_token: data.refresh_token || null,
                expires_at: Date.now() + (Number(data.expires_in) || 14400) * 1000,
                user_id: data.user_id || null,
                login: data.login || null,
                display_name: data.display_name || data.login || null,
                profile_image_url: data.profile_image_url || null
            });
            renderAccountOverlay("logged-in");
            return;
        }
        const msg = String(data.message || "");
        if (msg === "authorization_pending" || msg === "") {
            current.timer = setTimeout(pollDeviceLogin, current.interval);
            return;
        }
        deviceFlowState = null;
        renderAccountOverlay("qr-error", "No se pudo completar el login (" + msg + ").");
    } catch (e) {
        current.timer = setTimeout(pollDeviceLogin, current.interval);
    }
}

<script id="tv-4k-scale-script-v60">
(function(){
    var BASELINE_WIDTH = 1920;
    var BASELINE_HEIGHT = 1080;
    var isTizenApp = !!(window.tizen && window.tizen.application);
    if (!isTizenApp) return;
    function getViewportSize(){
        var w = window.innerWidth || document.documentElement.clientWidth || (window.screen && window.screen.width);
        var h = window.innerHeight || document.documentElement.clientHeight || (window.screen && window.screen.height);
        return { w: w, h: h };
    }
    function wrapBody(){
        if (document.getElementById('tv-scale-root')) return document.getElementById('tv-scale-root');
        var root = document.createElement('div');
        root.id = 'tv-scale-root';
        while (document.body.firstChild) {
            root.appendChild(document.body.firstChild);
        }
        document.body.appendChild(root);
        return root;
    }
    function applyTvScale(){
        var size = getViewportSize();
        if (!size.w || !size.h) return;
        var root = wrapBody();
        var scaleX = size.w / BASELINE_WIDTH;
        var scaleY = size.h / BASELINE_HEIGHT;
        var scale = Math.min(scaleX, scaleY);
        root.style.transform = 'scale(' + scale + ')';
        document.documentElement.setAttribute('data-tv-scaled', '1');
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTvScale);
    } else {
        applyTvScale();
    }
    window.addEventListener('resize', applyTvScale);
    window.addEventListener('orientationchange', applyTvScale);
    window.addEventListener('load', applyTvScale);
    setTimeout(applyTvScale, 400);
    setTimeout(applyTvScale, 1500);
})();
</script>

            el.style.cssText =
                "position:fixed;left:50%;bottom:48px;transform:translateX(-50%);" +
                "background:rgba(24,24,27,.95);color:#fff;font-size:15px;" +
                "padding:10px 18px;border-radius:8px;z-index:99999;" +
                "opacity:0;transition:opacity .15s ease;pointer-events:none;";
            document.body.appendChild(el);
        }
        el.style.opacity = "1";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            el.style.opacity = "0";
        }, DOUBLE_BACK_WINDOW_MS);
    }
    function isAtRootScreen() {
        var accountOverlay = document.getElementById("account-overlay");
        var searchOverlay = document.getElementById("home-search-overlay");
        var accountOpen = accountOverlay && accountOverlay.classList.contains("visible");
        var searchOpen = searchOverlay && searchOverlay.classList.contains("visible");
        return typeof currentScreen !== "undefined" && currentScreen === "main" && !accountOpen && !searchOpen;
    }
    function handleAndroidBack(e) {
        if (window.OsmPicker && OsmPicker.isOpen()) { OsmPicker.close(); return; }
        var accountOverlay = document.getElementById("account-overlay");
        if (accountOverlay && accountOverlay.classList.contains("visible")) {
            closeAccountOverlay();
            return;
        }
        var searchOverlay = document.getElementById("home-search-overlay");
        if (searchOverlay && searchOverlay.classList.contains("visible")) {
            closeHomeSearch();
            return;
        }
        if (!isAtRootScreen()) {
            goBack();
            return;
        }
        var now = Date.now();
        if (now - lastBackPressAt < DOUBLE_BACK_WINDOW_MS) {
            window.Capacitor.Plugins.App.exitApp();
        } else {
            lastBackPressAt = now;
            showExitToast();
        }
    }
    if (window.Capacitor.Plugins && window.Capacitor.Plugins.App &&
        typeof window.Capacitor.Plugins.App.addListener === "function") {
        window.Capacitor.Plugins.App.addListener("backButton", handleAndroidBack);
    }
    document.addEventListener("backButton", handleAndroidBack);
})();
</script>
<script id="tv-perf-final-v65">
(function () {

    try {
        const noop = function () {};
        Object.defineProperty(window, "updateFocusBackground", { value: noop, writable: false, configurable: false });
        Object.defineProperty(window, "clearFocusBackground",  { value: noop, writable: false, configurable: false });

    document.addEventListener("DOMContentLoaded", function () {
        const chatEl = document.getElementById("chat-messages");
        if (!chatEl) return;
        let pendiente = false;
        new MutationObserver(() => {
            if (pendiente) return;
            pendiente = true;
            requestAnimationFrame(() => {
                chatEl.scrollTop = chatEl.scrollHeight;
                pendiente = false;
            });
        }).observe(chatEl, { childList: true });
    });
    document.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.keyCode !== 39) return;
        const search = document.getElementById("search-nav-item");
        if (!search || document.activeElement !== search) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (typeof focusContentZone === "function") focusContentZone("featured", 0);
    }, true);
    const originalGoBack = typeof goBack === "function" ? goBack : null;
    if (originalGoBack) {
        window.goBack = function () {
            if (typeof currentScreen !== "undefined" && currentScreen === "main") {
                const rows = typeof getVisibleRowIds === "function" ? getVisibleRowIds() : [];
                const firstRow = rows.find(id =>
                    typeof getRowTileCount === "function" && getRowTileCount(id) > 0
                );
                if (focusZone === "content" &&
                    contentRowId === firstRow &&
                    contentTileIndex === 0) {
                    return;
                }
            }
            return originalGoBack.apply(this, arguments);
        };
    }
    document.addEventListener("keydown", function (e) {
        const overlay = document.getElementById("home-search-overlay");
        if (!overlay || !overlay.classList.contains("visible")) return;
        const code = e.keyCode || e.which;
        const isBack = e.key === "Escape" || e.key === "BrowserBack" ||
                       e.key === "GoBack" ||
                       code === 27 || code === 461 || code === 10009;
        if (!isBack) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (typeof closeHomeSearch === "function") closeHomeSearch();
    }, true);
    console.log("[v65] Parches TV aplicados.");
})();
</script>

<script id="sidebar-fit-perf-script-v67">
(function () {
    "use strict";
    var de = document.documentElement;
    var ua = navigator.userAgent || "";
    var lite = !!(window.Capacitor || window.tizen ||
        /Android|Tizen|Web0S|WebOS|SMART-TV|SmartTV|HbbTV|NetCast|BRAVIA/i.test(ua));
    if (lite) de.classList.add("perf-lite");
    if (lite && typeof Object.assign === "function") {
        try {
            ["scrollTo", "scrollBy"].forEach(function (name) {
                var orig = Element.prototype[name];
                if (typeof orig !== "function") return;
                Element.prototype[name] = function (a) {
                    if (a && typeof a === "object" && a.behavior === "smooth" &&
                        a.left !== undefined && a.top === undefined) {
                        a = Object.assign({}, a, { behavior: "auto" });
                    }
                    return arguments.length > 1 ? orig.call(this, a, arguments[1]) : orig.call(this, a);
                };
            });
        } catch (e) {}
    }
    var raf = 0, last = 1;
    function fit() {
        raf = 0;
        try {
            var sb = document.getElementById("sidebar");
            var nl = document.getElementById("nav-list");
            if (!sb || !nl) return;
            var root = document.getElementById("tv-scale-root");
            var scaled = de.hasAttribute("data-tv-scaled") && root;
            var avail = scaled ? root.offsetHeight
                : (window.innerHeight || de.clientHeight || 0);
            var natural = nl.offsetTop + nl.offsetHeight;
            if (!avail || !natural) return;
            var s = Math.max(0.5, Math.min(1, avail / (natural + 16)));
            if (Math.abs(s - last) < 0.005) return;
            last = s;
            de.style.setProperty("--sidebar-fit", s.toFixed(3));
        } catch (e) { console.warn("v67 fit:", e); }
    }
    function schedule() {
        if (raf) return;
        raf = (window.requestAnimationFrame || setTimeout)(fit);
    }
    function init() {
        schedule();
        window.addEventListener("resize", schedule);
        window.addEventListener("orientationchange", function () { setTimeout(schedule, 250); });
        if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule);
        window.addEventListener("load", function () { schedule(); setTimeout(schedule, 600); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
        var nl = document.getElementById("nav-list");
        if (nl && window.MutationObserver) {
            new MutationObserver(schedule).observe(nl, { childList: true });
        }
        var ms = document.getElementById("main-screen");
        if (ms && window.MutationObserver) {
            var wasActive = ms.classList.contains("active");
            new MutationObserver(function () {
                var act = ms.classList.contains("active");
                if (act !== wasActive) { wasActive = act; schedule(); }
            }).observe(ms, { attributes: true, attributeFilter: ["class"] });
        }
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
