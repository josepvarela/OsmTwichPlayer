<script id="osmtwich-focus-reveal-v274">
(function () {
  "use strict";
  /*
   * No alinear cada nueva fila al borde superior. El contenido permanece
   * quieto mientras la tarjeta enfocada esté dentro de una zona segura;
   * solo se desplaza lo mínimo al acercarse al borde del viewport.
   */
  function revealFocusedTile(tile, content) {
    if (!tile || !content || !content.contains(tile)) return;
    var rect = content.getBoundingClientRect();
    var tileRect = tile.getBoundingClientRect();
    var scale = (content.offsetHeight ? rect.height / content.offsetHeight : 1) || 1;
    var safeTop = Math.max(42, Math.min(92, rect.height * 0.075));
    var safeBottom = Math.max(48, Math.min(104, rect.height * 0.09));
    var visibleTop = rect.top + safeTop * scale;
    var visibleBottom = rect.bottom - safeBottom * scale;
    var delta = 0;
    if (tileRect.top < visibleTop) delta = (tileRect.top - visibleTop) / scale;
    else if (tileRect.bottom > visibleBottom) delta = (tileRect.bottom - visibleBottom) / scale;
    if (Math.abs(delta) > 1) {
      var maxScroll = Math.max(0, content.scrollHeight - content.clientHeight);
      content.scrollTop = Math.max(0, Math.min(maxScroll, content.scrollTop + delta));
    }
  }
  window.revealTileVertically = function (tile) {
    var content = document.getElementById("content");
    revealFocusedTile(tile, content);
  };
  console.log("[OsmTwich 2.7.4] Seguidos 3x3 y foco con desplazamiento mínimo.");
})();
</script>

 section.querySelector('#osm-backup-restore-usb').addEventListener('click',async()=>{try{const drives=await listUsb();if(!drives.length){pathEl.textContent='Ruta de copia: USB no detectada.';usbPrompt();throw Error('Conecta una memoria USB que contenga una copia de OsmTwich.')}const root=await new Promise((resolve,reject)=>resolveRoot(drives[0],resolve,reject));let folder;try{folder=root.resolve('OsmTwichBackups')}catch(e){throw Error('No se encontró la carpeta OsmTwichBackups en la memoria USB.')}const files=await new Promise((resolve,reject)=>folder.listFiles(resolve,reject));const backups=(files||[]).filter(f=>/\.json$/i.test(f.name||'')).sort((a,b)=>String(b.modified||b.created||b.name).localeCompare(String(a.modified||a.created||a.name)));if(!backups.length)throw Error('No hay copias de OsmTwich en la memoria USB.');const file=backups[0],data=await new Promise((resolve,reject)=>file.openStream('r',stream=>{try{const raw=stream.read(file.fileSize);stream.close();resolve(JSON.parse(raw))}catch(e){try{stream.close()}catch(_){}reject(e)}},reject,'UTF-8'));pathEl.textContent='Ruta de copia: '+drives[0].mountPoint.replace(/\/$/,'')+'/OsmTwichBackups/'+file.name;await applyBackup(data)}catch(e){status(msg,e.message||'No se pudo restaurar la copia desde USB.',true)}});

 }
 const original=window.renderAccountSettings; if(typeof original==='function'){window.renderAccountSettings=function(){original.apply(this,arguments);mount()}}else{document.addEventListener('DOMContentLoaded',()=>{const orig=window.renderAccountSettings;if(typeof orig==='function'){window.renderAccountSettings=function(){orig.apply(this,arguments);mount()}}})}
})();
</script>
